services:
  db:
    image: mysql:8.4
    environment:
      # Credenciales solo para desarrollo local
      MYSQL_DATABASE: bluecore
      MYSQL_USER: bluecore
      MYSQL_PASSWORD: bluecore
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
