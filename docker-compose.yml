services:
  db:
    # Misma versión mayor que la Aurora PostgreSQL de Bluecore (16)
    image: postgres:16
    environment:
      # Credenciales solo para desarrollo local
      POSTGRES_DB: demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Crea el rol usuario_a y su esquema esquema_a, como en la base de Bluecore
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
